# Weekly update pull requests for the image's base layers (Bun, Caddy) and the workflow actions.
# CI runs every suite on each one.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
