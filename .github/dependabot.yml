# Weekly update pull requests for the image's base layers (Bun, Caddy) and the workflow actions.
# CI runs every suite on each one.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The test and type dependencies, in bun.lock: Dependabot's npm ecosystem cannot update a Bun
  # lockfile, and failed every week with "This project has a bun.lock file".
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
