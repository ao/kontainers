name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, api, image, e2e, proxy, renewal, compose]
    steps:
      - uses: actions/checkout@v7
      - name: scripts/test.sh ${{ matrix.suite }}
        run: scripts/test.sh ${{ matrix.suite }}

  image-arm64:
    # The image must build on both release architectures.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kontainers:arm64 .
