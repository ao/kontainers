name: retag-image

# Copies an existing image tag to another name on Docker Hub without rebuilding (same digest).
# Used once to publish 0.2.0, which the first release pushed as v0.2.0.

on:
  workflow_dispatch:
    inputs:
      from:
        description: existing tag, e.g. v0.2.0
        required: true
      to:
        description: new tag, e.g. 0.2.0
        required: true

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the tag
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          for t in "$FROM" "$TO"; do
            echo "$t" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version tag: $t"; exit 1; }
          done
          docker buildx imagetools create -t "ataiva/kontainers:$TO" "ataiva/kontainers:$FROM"
          docker buildx imagetools inspect "ataiva/kontainers:$TO"
